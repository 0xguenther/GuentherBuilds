<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you · Agent Write-Path Check</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;background:#fafafa;color:#1a1a1a;margin:0;padding:24px 16px}
@media (prefers-color-scheme: dark){body{background:#111;color:#eee}}
main{max-width:640px;margin:0 auto}
.mut{color:#888;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Thank you</h1>
<p id="status">Checking your order…</p>
<p class="mut">Your report is delivered by a private link to the email you gave. The link is valid for 48 hours and can be opened up to 5 times.</p>
</main>
<script>
const id = new URLSearchParams(location.search).get('order');
const el = document.getElementById('status');
const labels = { pending_payment: 'Waiting for payment confirmation.', paid: 'Payment received. Your check is queued.', running: 'Your check is running.', delivered: 'Your report is ready. Check your email for the link.', rejected: 'Some tools are not supported in this version. We will contact you about a refund.', failed: 'The run failed. We will contact you about a refund.' };
async function poll() {
  if (!id) { el.textContent = 'No order found.'; return; }
  const res = await fetch('/api/audit/orders/' + encodeURIComponent(id));
  if (!res.ok) { el.textContent = 'Order not found.'; return; }
  const o = await res.json();
  el.textContent = labels[o.status] || o.status;
  if (!['delivered', 'rejected', 'failed'].includes(o.status)) setTimeout(poll, 5000);
}
poll();
</script>
</body>
</html>
