version: '3.8'

services:
  gunther-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gunther-core
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/gunther.db
    env_file:
      - .env
    volumes:
      - gunther_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gunther_data:
    driver: local
